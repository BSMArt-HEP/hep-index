[project]
name = "hep-index"
version = "0.1.0"
description = "Multi-codebase index for HEP software, served over MCP"
requires-python = ">=3.11"
dependencies = ["mcp>=1.2", "tomli-w>=1.0"]

[dependency-groups]
dev = ["pytest>=8"]

[project.scripts]
hep-index = "hep_index.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/hep_index"]

[tool.pytest.ini_options]
testpaths = ["tests"]
